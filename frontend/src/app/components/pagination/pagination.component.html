@let total = totalItems();
@if (total > 0) {
  @let page = currentPage();
  @let maxPages = totalPages();
  <nav class="pagination-container" aria-label="Pagination">
    <div class="pagination-info">
      Showing <strong>{{ startItem() }} - {{ endItem() }}</strong> of <strong>{{ total }}</strong> shows
    </div>

    <div class="pagination-controls">
      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="page === 1"
        aria-label="First page"
        matTooltip="First page"
        (click)="goToPage(1)"
      >
        <mat-icon class="p-icon">first_page</mat-icon>
      </button>
      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="page === 1"
        aria-label="Previous page"
        matTooltip="Previous page"
        (click)="goToPage(page - 1)"
      >
        <mat-icon class="p-icon">chevron_left</mat-icon>
      </button>

      @for (p of visiblePages(); track p) {
        <button
          mat-button
          class="p-num-btn"
          [class.active]="p === page"
          [attr.aria-label]="'Page ' + p"
          [attr.aria-current]="p === page ? 'page' : null"
          (click)="goToPage(p)"
        >
          {{ p }}
        </button>
      }

      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="page === maxPages"
        aria-label="Next page"
        matTooltip="Next page"
        (click)="goToPage(page + 1)"
      >
        <mat-icon class="p-icon">chevron_right</mat-icon>
      </button>
      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="page === maxPages"
        aria-label="Last page"
        matTooltip="Last page"
        (click)="goToPage(maxPages)"
      >
        <mat-icon class="p-icon">last_page</mat-icon>
      </button>
    </div>

    <div class="page-size-selector">
      <label for="pageSizeSelect">Per page:</label>
      <select
        id="pageSizeSelect"
        [value]="pageSize()"
        class="size-select"
        aria-label="Shows per page"
        (change)="handlePageSizeChange($event)"
      >
        <option [value]="25">25</option>
        <option [value]="50">50</option>
        <option [value]="100">100</option>
        <option [value]="99999">All</option>
      </select>
    </div>
  </nav>
}
