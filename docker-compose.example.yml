services:
  jellyfin-tracker-sync:
    build: .
    image: jellyfin-tracker-sync:latest
    container_name: jellyfin-tracker-sync
    restart: unless-stopped
    # Optional: match your host user UID:GID (or "0:0" for root)
    user: '1000:1000'
    ports:
      - '3224:3000'
    volumes:
      # Mount your configuration file (must be writable for token auto-refresh):
      - ./config.toml:/config/config.toml:rw
      # Optional: Persist anime library catalog database (and WAL files) and custom mapping overrides:
      - ./data:/config/data:rw
      - ./mapping-overrides.json:/config/mapping-overrides.json:rw
      # Persist downloaded anime mapping caches (~11MB) across container restarts/updates:
      - mapping-cache:/config/cache:rw
    environment:
      - TZ=America/New_York

volumes:
  mapping-cache:
